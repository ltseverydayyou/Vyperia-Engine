name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - mac
          - all

jobs:
  buildWindows:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'windows' || inputs.target == 'all'
    runs-on: windows-latest
    env:
      HXCPP_COMPILE_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5
      - name: Install Haxelib
        shell: cmd
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp 4.2.1 > nul
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib --never install flixel 4.11.0
          haxelib install flixel-ui 2.4.0
          haxelib install flixel-addons 2.11.0
          haxelib install tjson 1.4.0
          haxelib install hxjsonast 1.1.0
          haxelib install hxCodec 2.5.1
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit
          haxelib install hscript 2.5.0
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib set hxcpp 4.2.1
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-ui 2.4.0
          haxelib set flixel-addons 2.11.0
          haxelib set hscript 2.5.0
          haxelib set hxCodec 2.5.1
          haxelib list
      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION
      - name: Compile
        run: haxelib run lime build windows -verbose --app-version="0.1.0-${{ github.run_id }}"
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: export/release/windows/bin

  buildLinux:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'linux' || inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp 4.2.1 > /dev/null
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib --never install flixel 4.11.0
          haxelib install flixel-ui 2.4.0
          haxelib install flixel-addons 2.11.0
          haxelib install tjson 1.4.0
          haxelib install hxjsonast 1.1.0
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit
          haxelib install hscript 2.5.0
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib set hxcpp 4.2.1
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-ui 2.4.0
          haxelib set flixel-addons 2.11.0
          haxelib set hscript 2.5.0
          haxelib list
      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION
      - name: Compile
        run: haxelib run lime build Project.xml linux --app-version="0.1.0-${{ github.run_id }}"
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBuild
          path: export/release/linux/bin

  buildMac:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'mac' || inputs.target == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp 4.2.1 > /dev/null
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib --never install flixel 4.11.0
          haxelib install flixel-ui 2.4.0
          haxelib install flixel-addons 2.11.0
          haxelib install tjson 1.4.0
          haxelib install hxjsonast 1.1.0
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit
          haxelib install hscript 2.5.0
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib set hxcpp 4.2.1
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-ui 2.4.0
          haxelib set flixel-addons 2.11.0
          haxelib set hscript 2.5.0
          haxelib list
      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION
      - name: Compile
        run: haxelib run lime build mac --app-version="0.1.0-${{ github.run_id }}"
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macBuild
          path: export/release/macos/bin
